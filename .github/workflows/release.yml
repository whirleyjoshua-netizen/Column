# Builds the desktop installers and attaches them to a GitHub Release.
# Trigger: push a tag like v0.1.0  (git tag v0.1.0 && git push origin v0.1.0)
name: Release desktop app

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a release (always), or just build and keep the installers as run artifacts (never)'
        default: never
        type: choice
        options: [never, always]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      # Mac: signed with the Developer ID certificate and notarized by Apple (keys in the repo's secrets).
      - name: Notarization key
        if: runner.os == 'macOS'
        shell: bash
        run: printf '%s' "$P8" > "$RUNNER_TEMP/AuthKey.p8"
        env:
          P8: ${{ secrets.APPLE_API_KEY_P8 }}
      - name: Build (Mac, signed and notarized)
        if: runner.os == 'macOS'
        run: npx electron-builder --publish ${{ github.event.inputs.publish || 'always' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      # Windows and Linux: not signed yet (Windows needs a code-signing certificate).
      - name: Build (Windows, Linux)
        if: runner.os != 'macOS'
        run: npx electron-builder --publish ${{ github.event.inputs.publish || 'always' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Keep the installers (test runs)
        if: github.event.inputs.publish == 'never'
        uses: actions/upload-artifact@v4
        with:
          name: kloomie-${{ runner.os }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.exe
            desktop/dist/*.AppImage
          retention-days: 7
