# Builds the desktop installers and attaches them to a GitHub Release.
# Trigger: push a tag like v0.1.0  (git tag v0.1.0 && git push origin v0.1.0)
name: Release desktop app

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a release (always), or just build and keep the installers as run artifacts (never)'
        default: never
        type: choice
        options: [never, always]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      # Mac: signed with the Developer ID certificate and notarized by Apple (keys in the repo's secrets).
      - name: Notarization key
        if: runner.os == 'macOS'
        shell: bash
        run: printf '%s' "$P8" > "$RUNNER_TEMP/AuthKey.p8"
        env:
          P8: ${{ secrets.APPLE_API_KEY_P8 }}
      # The certificate goes into a keychain of our own (electron-builder's own temporary keychain fails to
      # unlock on GitHub's Mac machines), and electron-builder finds it there by name.
      - name: Signing keychain
        if: runner.os == 'macOS'
        shell: bash
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"
          KP="$(openssl rand -hex 16)"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KP" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KP" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASS" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KP" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KC"
        env:
          P12: ${{ secrets.MAC_CSC_LINK }}
          P12_PASS: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      - name: Build (Mac, signed and notarized)
        if: runner.os == 'macOS'
        run: npx electron-builder --publish ${{ github.event.inputs.publish || 'always' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_NAME: 'Joshua Whirley (S4J98YZVNT)'
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      # Windows and Linux: not signed yet (Windows needs a code-signing certificate).
      - name: Build (Windows, Linux)
        if: runner.os != 'macOS'
        run: npx electron-builder --publish ${{ github.event.inputs.publish || 'always' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Keep the installers (test runs)
        if: github.event.inputs.publish == 'never'
        uses: actions/upload-artifact@v4
        with:
          name: kloomie-${{ runner.os }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.exe
            desktop/dist/*.AppImage
          retention-days: 7
