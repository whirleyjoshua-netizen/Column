<!doctype html>
<!-- The picture links show when kloomie.com is shared. Remake it with:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --hide-scrollbars --window-size=1200,630 --screenshot=og.png brand/og.html, then save it as client/og.jpg -->
<html><head><meta charset="utf-8"><style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: radial-gradient(60% 80% at 78% 50%, #efe9ff, #fff 70%); font-family: -apple-system, "SF Pro Display", system-ui, sans-serif; color: #14121f; display: flex; align-items: center; }
  .text { padding-left: 80px; width: 640px; }
  .brand { display: flex; align-items: center; gap: 14px; font-size: 40px; font-weight: 750; letter-spacing: -.02em; }
  .brand img { width: 56px; height: 56px; }
  h1 { font-size: 64px; line-height: 1.02; letter-spacing: -.035em; margin: 34px 0 20px; font-weight: 800; }
  h1 span { color: #6b4cf0; }
  p { font-size: 26px; color: #5d5a70; margin: 0; line-height: 1.35; }
  .m { position: absolute; right: 30px; top: 70px; width: 560px; }
</style></head><body>
  <div class="text">
    <div class="brand"><img src="../client/icon-256.png">Kloomie</div>
    <h1>Your team’s work, <span>in one column.</span></h1>
    <p>Files, calls, email, contacts, docs and signatures for small business teams.</p>
  </div>
  <img class="m" src="../client/mascot.png">
</body></html>
