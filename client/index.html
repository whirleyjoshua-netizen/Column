<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Column</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#111115">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="login" class="login hidden">
    <form id="loginForm" autocomplete="on" novalidate>
      <img class="logo" src="/icon-128.png" alt="">
      <h1>Column</h1>
      <p class="sub">Drop anything. It shows up on every device.</p>
      <div class="seg" id="modeSeg">
        <button type="button" data-mode="signin" class="on">Sign in</button>
        <button type="button" data-mode="join">Join team</button>
        <button type="button" data-mode="create">Create team</button>
      </div>
      <p class="hint" id="modeHint"></p>
      <label>Team name<input name="workspace" required autocomplete="organization" placeholder="e.g. premier-studio"></label>
      <label>Your name<input name="name" required autocomplete="username" placeholder="Josh"></label>
      <label>Password<input name="password" type="password" required minlength="6" autocomplete="current-password"></label>
      <label id="codeField" class="hidden">Invite code<input name="code" autocomplete="off" placeholder="From someone on the team"></label>
      <label>This device<input name="device" placeholder="MacBook"></label>
      <button class="primary" type="submit" id="loginBtn">Sign in</button>
      <p class="err" id="loginErr"></p>
      <a class="backteam hidden" id="loginBack" href="#"></a>
      <a class="getapp" href="/download">Get the Column app for this device</a>
    </form>
  </div>

  <div id="app" class="app hidden">
    <header class="bar">
      <div class="ws" title="Switch team" role="button">
        <span class="live" id="liveDot"></span>
        <img id="wsLogo" class="ws-logo hidden" alt="">
        <span id="wsName"></span>
        <svg class="ws-more" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </div>
      <div class="devices" id="devices"></div>
      <button class="icon-btn" id="toolsBtn" title="Tools" aria-label="Tools">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><rect x="14" y="14" width="6" height="6" rx="1.5"/></svg>
      </button>
      <button class="icon-btn" id="settingsBtn" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </header>
    <nav class="tabs" id="tabs">
      <button data-tab="day" class="on">Day</button>
      <button data-tab="column">Stacks</button>
      <button data-tab="chat">Chat</button>
      <button data-tab="camps">Campaigns</button>
    </nav>
    <section id="day" class="day"></section>
    <main class="panes hidden" id="panes"></main>
    <section id="chat" class="chat hidden"></section>
    <div id="campsWrap" class="camps-wrap hidden">
      <section id="camps" class="camps"></section>
      <aside id="dock" class="dock hidden" aria-label="Kept beside"></aside>
    </div>
    <aside id="settings" class="settings hidden"></aside>
    <aside id="tool" class="settings tool hidden"></aside>
  </div>

  <div id="preview" class="preview hidden"></div>
  <div id="sheet" class="sheet-wrap hidden"></div>
  <div id="menu" class="menu hidden"></div>
  <div id="toasts" class="toasts"></div>
  <input type="file" id="filePick" multiple hidden>
  <script src="/pdfkit.js"></script>
  <script src="/wordkit.js"></script>
  <script src="/dockit.js"></script>
  <script src="/app.js"></script>
</body>
</html>
