<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Send files</title>
  <link rel="icon" href="/favicon.png">
  <style>
    :root { color-scheme: light dark; --bg: #f3f3f6; --card: #fff; --text: #16161a; --muted: #6b6b76; --line: #e2e2e8; --accent: #6b5cf0; --ok: #1f9d55; --bad: #d43c3c; }
    @media (prefers-color-scheme: dark) { :root { --bg: #111115; --card: #1b1b21; --text: #ececf1; --muted: #8d8d99; --line: #2c2c34; } }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .hidden { display: none !important; }
    main { max-width: 560px; margin: 0 auto; padding: 28px 16px 40px; }
    .brand { max-height: 44px; max-width: 180px; display: block; margin-bottom: 14px; border-radius: 6px; }
    h1 { font-size: 21px; margin: 0 0 4px; }
    .from { color: var(--muted); margin: 0 0 14px; font-size: 14px; }
    .msg { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; white-space: pre-wrap; margin: 0 0 14px; }
    label.name { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); margin-bottom: 12px; }
    input[type=text] { font: inherit; color: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 9px; background: var(--card); }
    .drop { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-align: center; background: var(--card); border: 2px dashed var(--line); border-radius: 14px; padding: 34px 16px; cursor: pointer; }
    .drop.over { border-color: var(--accent); }
    .drop b { font-size: 16px; }
    .drop small { color: var(--muted); }
    .btn { font: inherit; cursor: pointer; border: 0; background: var(--accent); color: #fff; border-radius: 10px; padding: 10px 20px; font-weight: 600; margin-top: 6px; }
    ul { list-style: none; padding: 0; margin: 14px 0 0; display: flex; flex-direction: column; gap: 8px; }
    li { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 14px; }
    li .top { display: flex; gap: 10px; justify-content: space-between; }
    li .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    li .st { color: var(--muted); flex: none; font-size: 13px; }
    li.done .st { color: var(--ok); }
    li.fail .st { color: var(--bad); }
    .bar { height: 4px; background: var(--line); border-radius: 2px; margin-top: 8px; overflow: hidden; }
    .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
    li.done .bar, li.fail .bar { display: none; }
    .small { font-size: 12px; color: var(--muted); margin-top: 18px; text-align: center; }
    .gone { text-align: center; padding-top: 60px; color: var(--muted); }
  </style>
</head>
<body>
  <main id="page"><p class="gone">Loading…</p></main>
  <script src="/request.js"></script>
</body>
</html>
