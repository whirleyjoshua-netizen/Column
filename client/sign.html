<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Sign a document</title>
  <link rel="icon" href="/favicon.png">
  <style>
    :root { color-scheme: light dark; --bg: #f3f3f6; --card: #fff; --text: #16161a; --muted: #6b6b76; --line: #e2e2e8; --accent: #6b5cf0; --want: #fff6d6; --want-line: #e8b400; --ok: #1f9d55; }
    @media (prefers-color-scheme: dark) { :root { --bg: #111115; --card: #1b1b21; --text: #ececf1; --muted: #8d8d99; --line: #2c2c34; --want: #3a3212; --want-line: #c99a00; } }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding-bottom: 90px; }
    .hidden { display: none !important; }
    header, .card, .done { max-width: 860px; margin: 0 auto; padding: 0 16px; }
    header { padding-top: 22px; }
    .brand { max-height: 40px; max-width: 180px; display: block; margin-bottom: 12px; border-radius: 6px; }
    h1 { font-size: 20px; margin: 0 0 4px; word-break: break-word; }
    .from { color: var(--muted); margin: 0 0 12px; font-size: 14px; }
    .msg { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; white-space: pre-wrap; margin: 0 0 14px; }
    .card > div { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
    .consent label { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
    .consent input[type=checkbox] { width: 20px; height: 20px; margin-top: 1px; flex: none; accent-color: var(--accent); }
    .consent .name { display: flex; flex-direction: column; gap: 4px; margin-top: 12px; font-size: 13px; color: var(--muted); }
    input, textarea, select { font: inherit; color: inherit; }
    .consent .name input, textarea { padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
    button { font: inherit; cursor: pointer; }
    .btn { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 9px; padding: 9px 16px; font-weight: 600; }
    .btn.go { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn:disabled { opacity: 0.5; cursor: default; }
    .link { background: none; border: 0; color: var(--muted); text-decoration: underline; padding: 6px; }
    .doc { max-width: 900px; margin: 0 auto; padding: 0 8px; }
    .pdf-page { position: relative; margin: 0 auto 12px; background: #fff; box-shadow: 0 2px 12px rgba(0,0,0,.12); }
    .pdf-page canvas { width: 100%; height: 100%; display: block; }
    .pdf-layer { position: absolute; inset: 0; }
    .f { position: absolute; border: 2px dashed var(--want-line); background: var(--want); border-radius: 4px; display: flex; align-items: center; justify-content: center; color: #6a5200; font-size: 12px; font-weight: 600; overflow: hidden; padding: 0; }
    .f.filled { border-style: solid; border-color: rgba(31,157,85,.5); background: rgba(31,157,85,.06); }
    .f img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .f input { width: 100%; height: 100%; border: 0; background: transparent; padding: 0 3px; color: #111; font-family: Helvetica, Arial, sans-serif; }
    .f.locked { opacity: 0.6; }
    .foot { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line); padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); display: flex; align-items: center; gap: 10px; z-index: 5; }
    .foot .left { flex: 1; color: var(--muted); font-size: 13px; min-width: 0; }
    .err { color: #d43c3c; font-size: 13px; margin: 6px 0 0; }
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
    .modal > div { background: var(--card); border-radius: 14px; padding: 18px; width: min(560px, 100%); }
    .modal h2 { margin: 0 0 12px; font-size: 17px; }
    .modal .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
    .modal textarea { width: 100%; }
    .sig-pad { display: flex; flex-direction: column; gap: 8px; }
    .sig-tabs { display: flex; gap: 6px; }
    .sig-tabs button { border: 1px solid var(--line); background: none; color: var(--muted); border-radius: 999px; padding: 4px 14px; }
    .sig-tabs button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
    .sig-canvas { width: 100%; aspect-ratio: 520 / 170; background: #fff; border: 1px solid var(--line); border-radius: 10px; touch-action: none; cursor: crosshair; }
    .sig-type { padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
    .sig-foot { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; }
    .sig-foot .link { padding: 0; }
    .done { text-align: center; padding-top: 60px; }
    .done .tick { width: 56px; height: 56px; border-radius: 50%; background: var(--ok); color: #fff; font-size: 30px; line-height: 56px; margin: 0 auto 14px; }
    .done a.btn { display: inline-block; text-decoration: none; margin-top: 10px; }
    .done p { color: var(--muted); }
    .small { font-size: 12px; color: var(--muted); }
  </style>
</head>
<body>
  <main id="page"><p class="done">Loading…</p></main>
  <script src="/pdfkit.js"></script>
  <script src="/sign.js"></script>
</body>
</html>
